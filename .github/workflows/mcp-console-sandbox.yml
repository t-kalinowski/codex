name: Native sandbox executable (macOS and Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - "mcp-console/sandbox-runner/**"

permissions:
  contents: read

jobs:
  linux-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
      - name: Prepare the pinned release toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GITHUB_ENV='${{ runner.temp }}/sandbox-musl.env' \
            bash ../.github/scripts/install-musl-build-tools.sh
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> '${{ runner.temp }}/sandbox-musl.env'
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and hash the release helper
        run: |
          while IFS= read -r setting; do export "${setting?}"; done < '${{ runner.temp }}/sandbox-musl.env'
          cargo build --locked --release --target '${{ matrix.target }}' -p codex-bwrap --bin bwrap
          helper='target/${{ matrix.target }}/release/bwrap'
          strip --strip-debug --strip-unneeded "$helper"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$helper" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Build and inspect the standalone artifacts
        run: |
          while IFS= read -r setting; do export "${setting?}"; done < '${{ runner.temp }}/sandbox-musl.env'
          cargo build --locked --release --target '${{ matrix.target }}' -p codex-mcp-console-sandbox --bin mcp-console-sandbox
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          for name in ('mcp-console-sandbox', 'bwrap'):
              binary = Path('target/${{ matrix.target }}/release') / name
              report = subprocess.check_output(['readelf', '-W', '-l', '-d', '-V', binary], text=True)
              print(report)
              assert 'INTERP' not in report and '(NEEDED)' not in report and 'Name:' not in report
          PY
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Exercise release transport and lifecycle contracts
        # These public contracts do not inject a glibc LD_PRELOAD library into
        # the runner. Fault-injection suites remain in the GNU job below.
        run: |
          env "CARGO_BIN_EXE_mcp-console-sandbox=$PWD/target/${{ matrix.target }}/release/mcp-console-sandbox" \
            "CARGO_BIN_EXE_bwrap=$PWD/target/${{ matrix.target }}/release/bwrap" \
            just test --locked -p codex-mcp-console-sandbox --retries 0 \
              -E 'test(transport::) | test(lifecycle::)'

  contract:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ runner.os }}
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run executable contracts
        run: just test --locked -p codex-mcp-console-sandbox --retries 0
      - name: Lint native executable
        run: cargo clippy -p codex-mcp-console-sandbox --all-targets --all-features -- -D warnings
      - name: Test native sandbox
        # These two unchanged release tests also fail at 90854393966b:
        # their exact stderr matcher excludes bash's added "line 1:" prefix.
        # Preserve the existing exclusions; see mcp-console-sandbox/REBASE.md.
        run: |
          just test -p codex-sandboxing -- \
            --skip create_seatbelt_args_with_read_only_git_and_codex_subpaths \
            --skip create_seatbelt_args_with_read_only_git_pointer_file
      - name: Test Bazel executable and argument comments
        run: |
          bazel test //codex-rs/mcp-console-sandbox:bootstrap-contract-test
          just argument-comment-lint -p codex-mcp-console-sandbox
      - name: Build standalone release executable
        run: cargo build --locked -p codex-mcp-console-sandbox --bin mcp-console-sandbox --release
      - name: Run all contracts against release executable
        run: |
          sandbox_target_dir="$(cargo metadata --locked --format-version=1 --no-deps |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          env "CARGO_BIN_EXE_mcp-console-sandbox=$sandbox_target_dir/release/mcp-console-sandbox" \
            just test --locked -p codex-mcp-console-sandbox --retries 0
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ runner.os }}
      - name: Install ordinary bubblewrap build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Record Linux prerequisites
        run: |
          cat /etc/os-release
          uname -a
          rustc --version
          cargo --version
          bazel --version
          bwrap --version
          pkg-config --modversion libcap
          sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns
          unshare --user --map-root-user --mount --net --pid --fork true
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build ordinary bundled bubblewrap
        run: |
          cargo build --locked -p codex-bwrap --bin bwrap
          sandbox_target_dir="$(cargo metadata --locked --format-version=1 --no-deps |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          echo "SANDBOX_TARGET_DIR=$sandbox_target_dir" >> "$GITHUB_ENV"
      - name: Run executable contracts
        run: |
          env "CARGO_BIN_EXE_bwrap=$SANDBOX_TARGET_DIR/debug/bwrap" \
            just test --locked -p codex-mcp-console-sandbox --retries 0
      - name: Test native Linux sandbox
        # An unchanged native test copies the host bwrap into a bundled fixture.
        # Supply the actual bundled capabilities; leaf tests set their own PATH.
        run: |
          env "PATH=$SANDBOX_TARGET_DIR/debug:$PATH" \
            "CARGO_BIN_EXE_bwrap=$SANDBOX_TARGET_DIR/debug/bwrap" \
            just test -p codex-sandboxing -p codex-linux-sandbox -p codex-bwrap --retries 0
      - name: Test Bazel executable and argument comments
        run: |
          bazel test //codex-rs/mcp-console-sandbox:bootstrap-contract-test
          just argument-comment-lint -p codex-mcp-console-sandbox
      - name: Build standalone release executable and bubblewrap
        run: |
          cargo build --locked --release \
            -p codex-mcp-console-sandbox --bin mcp-console-sandbox \
            -p codex-bwrap --bin bwrap
      - name: Run all contracts against release artifacts
        run: |
          env "CARGO_BIN_EXE_mcp-console-sandbox=$SANDBOX_TARGET_DIR/release/mcp-console-sandbox" \
            "CARGO_BIN_EXE_bwrap=$SANDBOX_TARGET_DIR/release/bwrap" \
            just test --locked -p codex-mcp-console-sandbox --retries 0
      - name: Lint native executable
        run: cargo clippy -p codex-mcp-console-sandbox --all-targets --all-features -- -D warnings
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
