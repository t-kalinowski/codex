name: Native sandbox runner (macOS)

on:
  workflow_dispatch:
  push:
    branches:
      - "mcp-console/sandbox-runner/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: ${{ runner.os }}
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run executable contracts
        run: just test -p codex-mcp-console-sandbox
      - name: Lint runner
        run: cargo clippy -p codex-mcp-console-sandbox --all-targets --all-features -- -D warnings
      - name: Test native sandbox
        # These two unchanged release tests also fail at 90854393966b:
        # their exact stderr matcher excludes bash's added "line 1:" prefix.
        # Preserve the existing exclusions; see mcp-console-sandbox/REBASE.md.
        run: |
          just test -p codex-sandboxing -- \
            --skip create_seatbelt_args_with_read_only_git_and_codex_subpaths \
            --skip create_seatbelt_args_with_read_only_git_pointer_file
      - name: Test Bazel executable and argument comments
        run: |
          bazel test //codex-rs/mcp-console-sandbox:bootstrap-contract-test
          just argument-comment-lint -p codex-mcp-console-sandbox
      - name: Build standalone release executable
        run: cargo build --locked -p codex-mcp-console-sandbox --bin mcp-console-sandbox --release
      - name: Smoke release executable
        run: |
          env \
            "CARGO_BIN_EXE_mcp-console-sandbox=${CARGO_TARGET_DIR}/release/mcp-console-sandbox" \
            just test -p codex-mcp-console-sandbox filesystem_policy_denies_and_grants_writes
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
