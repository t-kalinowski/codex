[package]
name = "codex-mcp-console-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mcp-console-sandbox"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "mcp-console-sandbox-fixture"
path = "src/bin/mcp_console_sandbox_fixture.rs"
test = false
bench = false

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow = { workspace = true }
codex-network-proxy = { workspace = true }
codex-protocol = { workspace = true }
codex-sandboxing = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
codex-linux-sandbox = { workspace = true }

# Match the release binaries' native linkage without depending on codex-core
# to enable this feature through Cargo's workspace feature unification.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
